<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fence the Farm</title>
<meta name="description" content="An educational strategy puzzle for Grades 8-10: same perimeter, different area.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 32px;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: #7AB92C url('game/assets/art/grass-bg.png') center / cover no-repeat;
  }
  .wrap { width: 100%; max-width: 560px; text-align: center; }
  h1 {
    margin: 0 0 6px; font: 900 clamp(38px, 8vw, 62px) 'Nunito', sans-serif;
    color: #FFF6E0; letter-spacing: -.5px; line-height: 1.02;
    text-shadow: 0 4px 0 #4A2E12, 0 10px 26px rgba(0, 0, 0, .45);
  }
  p.sub {
    margin: 0 0 30px; font: 700 clamp(15px, 3vw, 19px) 'Nunito Sans', sans-serif;
    color: #EFFFD2; text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
  }
  .cards { display: grid; gap: 14px; }
  a.card {
    display: block; padding: 18px 22px; border-radius: 18px; text-decoration: none;
    border: 4px solid transparent; text-align: left;
    transition: transform 130ms ease, box-shadow 130ms ease;
  }
  a.card:hover { transform: translateY(-3px); }
  a.card:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(91, 196, 196, .95); }
  .play {
    color: #FFF7DA;
    background:
      linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 46%) padding-box,
      linear-gradient(180deg, #FFDA0C 0%, #FDB202 28%, #FB7C02 62%, #E84203 100%) padding-box,
      linear-gradient(180deg, #FFE838 0%, #FDAE02 42%, #CE2802 100%) border-box;
    box-shadow: inset 0 -5px 9px rgba(176,44,2,.4), 0 5px 0 #A82702, 0 12px 20px rgba(60,20,0,.36);
  }
  .play:hover { box-shadow: inset 0 -5px 9px rgba(176,44,2,.4), 0 7px 0 #A82702, 0 16px 26px rgba(60,20,0,.4), 0 0 24px rgba(255,168,20,.5); }
  .lab {
    color: #FFEFCB;
    background:
      linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 46%) padding-box,
      linear-gradient(180deg, #E0A03A 0%, #C0762A 52%, #96501A 100%) padding-box,
      linear-gradient(180deg, #EFB74C 0%, #7C3C10 100%) border-box;
    box-shadow: 0 5px 0 #6B3208, 0 12px 20px rgba(50,22,0,.3);
  }
  .lab:hover { box-shadow: 0 7px 0 #6B3208, 0 16px 26px rgba(50,22,0,.34); }
  .name { display: block; font: 900 26px 'Nunito', sans-serif; text-shadow: 0 2px 0 rgba(90,30,0,.55); }
  .what { display: block; margin-top: 2px; font: 700 14px 'Nunito Sans', sans-serif; opacity: .92; }
  footer {
    margin-top: 26px; font: 700 12px 'Nunito Sans', sans-serif; letter-spacing: 1.6px;
    text-transform: uppercase; color: rgba(255, 246, 224, .8); text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Fence the Farm</h1>
    <p class="sub">Same perimeter. Different area.</p>
    <div class="cards">
      <!-- The primary card is the top-down rebuild in lab/. game/ is the
           earlier side-view build, kept as it was and reachable below, so
           nothing is overwritten to change which one the front door serves. -->
      <a class="card play" href="lab/index.html">
        <span class="name">Play</span>
        <span class="what">Four farms, then the proof. The build people should see.</span>
      </a>
      <a class="card lab" href="game/index.html">
        <span class="name">Earlier build</span>
        <span class="what">The first side-view version, kept for reference.</span>
      </a>
    </div>
    <footer>Grades 8&ndash;10 &middot; 1280 &times; 720 &middot; no build step</footer>
  </div>
</body>
</html>
